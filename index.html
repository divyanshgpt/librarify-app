<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Librarify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Theme: every colour below was sampled from the reference design ===== */
:root{
  --cream:#FBF8F0;      /* page */
  --side:#E1F0E1;       /* sidebar */
  --pill:#CBE2CB;       /* active menu item */
  --card:#FFFDF9;       /* cards, inputs, table rows */
  --head:#F8F5EE;       /* table header row */
  --line:#D4DED4;       /* borders and dividers */
  --line2:#C9D9C9;      /* sidebar dividers */
  --quote:#EDF4E8;      /* quote card */
  --ink:#14231A;        /* headings and strong text */
  --deep:#14301C;       /* active menu text, logo word */
  --green:#205031;      /* primary button, logo mark */
  --accent:#326C43;     /* eyebrows, icons, links */
  --mut:#5E6D62;        /* secondary text */
  --mut2:#6E7B70;
  --coral:#DF6446;      /* highlights, notification dot */
  --coral-bg:#F7E2D7; --coral-ink:#8F3420;
  --free-bg:#EAEEE7;    /* "Available" chip */
  --out-bg:#F8E8D4; --amber:#DD9742; --brown:#3D2013;   /* "On loan" chip */
  --beige:#F1DABC; --beige2:#DFD5B1;                    /* avatars */
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.005em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mut{color:var(--mut)}
.ic{width:20px;height:20px;flex:none}

/* ----- buttons & fields ----- */
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--accent)}
button.pri{background:var(--green);border-color:var(--green);color:var(--cream)}
button.pri:hover{background:var(--deep);border-color:var(--deep)}
button.ghost{background:transparent;border-color:transparent;color:var(--mut)}
button.ghost:hover{background:var(--head);color:var(--ink)}
button.sm{padding:5px 12px;font-size:13px;border-radius:8px}
button.danger:hover{border-color:var(--coral);color:var(--coral-ink);background:var(--coral-bg)}
button.link{background:none;border:0;padding:2px 0;color:var(--accent);font-size:13px;font-weight:600}
button.link:hover{text-decoration:underline}
.ibtn{width:34px;height:34px;padding:0;border-radius:9px;background:transparent;border-color:transparent;color:var(--mut)}
.ibtn:hover{background:var(--head);border-color:var(--line);color:var(--ink)}
.ibtn.danger:hover{background:var(--coral-bg);border-color:var(--coral-bg);color:var(--coral-ink)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(50,108,67,.16)}
select{width:auto;cursor:pointer;padding-right:30px}
label{display:block;margin-bottom:12px;color:var(--mut);font-size:14px}
label input,label select{margin-top:4px;color:var(--ink)}
label select{display:block;width:100%}
.pw{position:relative;display:block;margin-top:4px}.pw input{margin-top:0;padding-right:44px}
.pw .eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px 8px;color:var(--mut)}
.pw .eye:hover{color:var(--ink)}.pw .eye svg{width:18px;height:18px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.eyebrow.coral{color:var(--coral)}.eyebrow .ic{width:18px;height:18px;color:var(--coral)}

/* ----- login ----- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--side);padding:48px 6vw 7vw;display:flex;flex-direction:column;justify-content:space-between;gap:48px}
.hero h1{font-size:clamp(52px,6.4vw,92px);line-height:.98;letter-spacing:-.015em}
.hero p{max-width:34ch;font-size:18px;color:var(--mut);margin:20px 0 0}
.panel{display:grid;place-items:center;padding:24px}
.panel form{width:min(390px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px}
.panel h2{font-size:36px;margin-bottom:18px}
.panel .pri{width:100%;padding:12px;margin-top:4px}
.panel .alt{width:100%;margin-top:10px}
.forgot{text-align:right;margin:-6px 0 6px}
.msg{min-height:20px;color:var(--coral-ink);font-size:14px;margin:4px 0}
.logo{display:flex;align-items:center;gap:14px}
.mark{display:grid;place-items:center;width:50px;height:50px;border-radius:12px;background:var(--green);color:var(--cream)}
.mark .ic{width:26px;height:26px}
.word{font:400 34px/.95 var(--serif);color:var(--deep);letter-spacing:-.01em}
.word small{display:block;margin-top:6px;font:700 11px var(--sans);letter-spacing:.17em;text-transform:uppercase;color:var(--mut)}

/* ----- app shell ----- */
.app{display:grid;grid-template-columns:293px 1fr;min-height:100vh}
.side{background:var(--side);padding:24px 18px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.slabel{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:34px 10px 12px}
.side nav{display:grid;gap:4px}
.side nav button{justify-content:flex-start;gap:14px;background:none;border:0;border-radius:12px;padding:12px 14px;font-size:16.5px;font-weight:500;color:var(--mut);text-align:left}
.side nav button:hover{background:rgba(203,226,203,.55);color:var(--deep)}
.side nav button.on{background:var(--pill);color:var(--deep);font-weight:600}
.side nav .ic{width:22px;height:22px}
.side-foot{margin-top:auto;padding-top:24px;display:grid;gap:18px}
.quote{background:var(--quote);border:1px solid var(--line2);border-radius:12px;padding:16px}
.quote b{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--deep)}
.quote b .ic{width:18px;height:18px;color:var(--coral)}
.quote p{font:400 22px/1.2 var(--serif);margin:10px 0 10px;color:var(--ink)}
.quote small{color:var(--mut);font-size:13px}
.me{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line2);padding-top:16px}
.me b{display:block;color:var(--deep);line-height:1.25}.me small{color:var(--mut);font-size:14px}
.me .grow{flex:1;min-width:0}
.av{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--beige2);font-weight:700;font-size:14px;flex:none;color:var(--deep)}
.col{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:34px 0 26px;border-bottom:1px solid var(--line)}
.crumb{color:var(--mut);font-size:15.5px}.crumb b{color:var(--ink);font-weight:500}.crumb span{margin:0 8px}
.tools{display:flex;align-items:center;gap:14px}
.gsearch{display:flex;align-items:center;gap:10px;margin:0;width:320px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px 0 14px;box-shadow:0 1px 2px rgba(20,35,26,.05);color:var(--mut)}
.gsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(50,108,67,.16)}
.gsearch input{border:0;background:none;padding:12px 0;box-shadow:none!important}
.gsearch kbd{font:600 12px var(--sans);color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--card);white-space:nowrap}
.bell{position:relative;width:48px;height:48px;padding:0;border-radius:12px;background:var(--card);box-shadow:0 1px 2px rgba(20,35,26,.05)}
.bell i{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
.bell i[hidden]{display:none}
.avbtn{width:46px;height:46px;border-radius:50%;background:var(--beige);border:0;padding:0;font-weight:700;color:var(--ink)}
main{padding:0 0 40px;max-width:1120px}
.col>.top,.col>main{margin-left:clamp(20px,4.4vw,56px);margin-right:clamp(20px,4.4vw,56px)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-top:40px}
.page-head h1{font-size:clamp(42px,5.6vw,66px);line-height:1;margin:14px 0 14px;letter-spacing:-.015em}
.sub{margin:0;color:var(--mut2);font-size:18px}
.head-actions{padding-bottom:6px}

/* ----- stat strip ----- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:30px 0 52px}
.cell{padding:22px 26px;border-left:1px solid var(--line)}
.cell:first-child{border-left:0;padding-left:0}
.cell-top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px}
.cell-top .ic{color:var(--accent)}
.num{font:400 clamp(40px,4vw,50px)/1.05 var(--serif);margin:12px 0 10px;color:var(--ink)}
.cell-sub{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13.5px}.cell-sub .ic{width:15px;height:15px}

/* ----- sections, tables ----- */
.block{margin-bottom:56px}
.block-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.block h2{font-size:clamp(32px,3.4vw,42px);line-height:1.05;margin-top:10px}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.count{color:var(--mut);font-size:14px;margin-right:6px}
.tbl{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);background:var(--head);padding:15px 22px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:16px 22px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td .bk>div,td small.due{white-space:normal}
thead+tbody tr:first-child td{border-top:0}
tbody tr:hover{background:var(--cream)}
td small{display:block;color:var(--mut);font-size:13.5px;margin-top:2px}
td b{font-weight:600}
.bk{display:flex;align-items:center;gap:16px}
.cover{display:grid;place-items:center;width:50px;height:50px;border-radius:8px;flex:none}
.cover .ic{width:24px;height:24px}
.acts{text-align:right;white-space:nowrap}.acts>*{vertical-align:middle;margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.free,.chip.ok{background:var(--free-bg);color:var(--accent)}
.chip.out{background:var(--out-bg);color:var(--brown)}.chip.out i{background:var(--amber)}
.chip.bad{background:var(--coral-bg);color:var(--coral-ink)}.chip.bad i{background:var(--coral)}
.chip.done{background:#E4E7DD;color:var(--green)}
td .due{margin-top:6px}
.empty{padding:52px;text-align:center;color:var(--mut)}
.seg{display:inline-flex;background:var(--head);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;gap:2px}
.seg button{border:0;background:none;color:var(--mut);padding:8px 16px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--card);color:var(--deep);box-shadow:0 1px 3px rgba(20,35,26,.12)}
.who{display:flex;align-items:center;gap:12px}
.who .av{width:36px;height:36px;font-size:13px}

/* ----- recent activity, shelves card, note ----- */
.act{display:flex;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.block h2+.act{margin-top:18px}
.act .av{width:46px;height:46px}
.act-main{flex:1;min-width:0}.act-main b{font-weight:600}.act-main small{display:block;color:var(--mut);margin-top:2px;font-size:14.5px}
.act-side{text-align:right;font-size:13px;font-weight:600}.act-side small{display:block;color:var(--mut);font-weight:400;margin-top:2px}
.act-side .okc{color:var(--accent);display:inline-flex;align-items:center;gap:4px}.act-side .ic{width:14px;height:14px}
.more{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:16px 0 0;border:0;border-top:1px solid var(--line);border-radius:0;background:none;color:var(--green);width:100%;justify-content:flex-start}
.more:hover{text-decoration:underline;border-color:var(--line)}
.more .ic{width:16px;height:16px}
.picks{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.tiles{display:flex;height:180px}
.tile{flex:1;border:0;border-radius:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:2px;padding:18px;text-align:left;font-weight:400}
.tile:hover{filter:brightness(1.07)}
.tile span{font:400 clamp(22px,2.4vw,30px)/1.05 var(--serif)}
.tile small{font-size:13px;opacity:.85}
.picks-foot{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.picks-foot b{display:block;margin-top:6px}.picks-foot .ic{color:var(--accent)}
.note{border-top:1px solid var(--line);padding-top:36px;margin-top:44px}
.note h2{margin:14px 0 10px}
.note p{margin:0 0 20px;max-width:62ch;color:var(--mut)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.5px}
.meta .ic{color:var(--accent)}.meta i{width:3px;height:3px;border-radius:50%;background:var(--mut2)}
.foot{border-top:1px solid var(--line);padding-top:22px;font-size:13.5px;color:var(--mut)}

/* overview page */
.story{font:400 clamp(30px,3.8vw,46px)/1.22 var(--serif);max-width:22em;margin:34px 0 14px}
.story em{font-style:normal;color:var(--accent);border-bottom:2px solid var(--pill)}
.story em.bad{color:var(--coral);border-color:var(--coral-bg)}
.pace{color:var(--mut);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.card h3{font:700 12px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.card .big{font:400 40px/1.05 var(--serif);color:var(--accent)}
.card ol,.card ul{margin:0;padding-left:20px}.card li{margin-bottom:6px}.card li small{color:var(--mut)}
.card p{margin:8px 0 0}
.fact{grid-column:1/-1;background:var(--quote);border-color:var(--line2);font:400 24px/1.35 var(--serif)}
.fact small{display:flex;align-items:center;gap:8px;font:700 12px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.fact small .ic{width:18px;height:18px;color:var(--coral)}
.news{margin-top:46px}.news h2{font-size:38px;margin-bottom:10px}
.news a{display:block;padding:14px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.news a:hover b{color:var(--accent)}.news a small{display:block;color:var(--mut)}

/* ----- popovers, dialogs, toasts ----- */
.pop{position:fixed;z-index:40;width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,35,26,.18);padding:8px;animation:pop .14s ease-out}
.pop h4{margin:8px 10px 6px;font:700 12px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--mut)}
.pop .it{padding:10px;border-radius:10px}.pop .it+.it{border-top:1px solid var(--line)}
.pop .it small{display:block;color:var(--mut);font-size:13px}.pop .it b.bad{color:var(--coral-ink)}
.pop .empty{padding:22px 12px}
.pop button{width:100%;justify-content:flex-start;background:none;border:0;border-radius:9px;font-weight:500;padding:10px 12px}
.pop button:hover{background:var(--head)}
.ov{position:fixed;inset:0;background:rgba(20,35,26,.5);display:flex;overflow:auto;padding:16px;z-index:50}
.ov form{margin:auto;width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.ov h3{font-size:30px;margin-bottom:12px}
.ov .row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.err{color:var(--coral-ink);font-size:14px;min-height:20px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:max-content;max-width:calc(100vw - 32px)}
#toast div{background:var(--deep);color:var(--cream);padding:11px 20px;border-radius:12px;font-weight:500;animation:pop .2s;box-shadow:0 10px 30px rgba(20,35,26,.25)}
#toast div.bad{background:var(--coral-ink)}

/* ----- smaller screens ----- */
@media(max-width:1100px){.strip{grid-template-columns:repeat(2,1fr)}.cell:nth-child(3){border-left:0;padding-left:0}.cell:nth-child(n+3){border-top:1px solid var(--line)}.gsearch{width:240px}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;overflow:visible}
  .slabel,.quote{display:none}.side nav{display:flex;order:3;width:100%;overflow-x:auto}.side nav button{white-space:nowrap;padding:9px 12px;font-size:15px}
  .side-foot{margin:0 0 0 auto;padding:0}.me{border:0;padding:0}.me .grow,.me .av{display:none}
  .login{grid-template-columns:1fr}.hero{padding:36px 24px 8px}
  .top{flex-wrap:wrap;padding-top:20px}.gsearch{width:100%;flex:1}.tools{width:100%}
}
@media(max-height:760px){.quote{display:none}}
@media(max-width:560px){.strip{grid-template-columns:1fr}.cell{border-left:0!important;padding-left:0!important;border-top:1px solid var(--line)}.cell:first-child{border-top:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = {user:null, tab:"", q:"", cat:"All", st:"all", mode:"active", rows:[], alerts:[], cats:[], tipped:false};
const LIB = () => S.user.role === "librarian";

/* ---------- small helpers ---------- */
const P = {
  library:`<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>`,
  overview:`<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>`,
  book:`<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>`,
  users:`<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
  copy:`<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>`,
  search:`<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>`,
  bell:`<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>`,
  plus:`<path d="M5 12h14"/><path d="M12 5v14"/>`,
  clock:`<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,

const hash = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);

const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayISO = () => iso(new Date());
const plusDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const fdate = s => { if (!s) return ""; const d = new Date(s + "T00:00:00");
  return d.toLocaleDateString("en-US", {month:"short", day:"numeric", ...(d.getFullYear() !== new Date().getFullYear() ? {year:"numeric"} : {})}); };

async function api(a, d = {}) {
  let r, j;
  try { r = await fetch("/api/" + a, {method:"POST", body:JSON.stringify(d)}); j = await r.json(); }
  catch { throw new Error("offline"); }
  if (!r.ok) { if (r.status === 401 && a !== "login" && a !== "me") { S.user = null; boot(); } throw new Error(j.error); }
  return j;
}
function toast(m, bad) {
  const t = document.createElement("div"); t.textContent = m; if (bad) t.className = "bad";
  $("#toast").append(t); setTimeout(() => t.remove(), 3500);
}

/* a show/hide eye button on every password box inside `root` */
function peekable(root) {
  root.querySelectorAll('input[type="password"]').forEach(input => {
    const wrap = document.createElement("span"); wrap.className = "pw";
    input.replaceWith(wrap); wrap.append(input);
    const eye = document.createElement("button");
    eye.type = "button"; eye.className = "eye"; eye.innerHTML = ic("eye");
    eye.title = "Show password"; eye.setAttribute("aria-label", "Show password");
    eye.onclick = () => {
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      eye.innerHTML = ic(show ? "eyeoff" : "eye");
      eye.title = show ? "Hide password" : "Show password"; eye.setAttribute("aria-label", eye.title);
      input.focus();
    };
    wrap.append(eye);
  });
}
function modal(title, fields, ok, fn, msg = "") {
  const d = document.createElement("div"); d.className = "ov";
  d.innerHTML = `<form><h3>${esc(title)}</h3>${msg ? `<p class="mut">${esc(msg)}</p>` : ""}${fields.map(f => `<label>${esc(f.l)}${
    f.t === "select" ? `<select name="${f.k}">${f.o.map(o => `<option>${esc(o)}</option>`).join("")}</select>`
    : `<input name="${f.k}" type="${f.t || "text"}" value="${esc(f.v)}" ${f.ro ? "readonly" : ""} ${f.dl ? `list="dl_${f.k}"` : ""} autocomplete="off">${
      f.dl ? `<datalist id="dl_${f.k}">${f.dl.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : ""}`}</label>`).join("")
    }<div class="err"></div><div class="row"><button type="button" class="ghost">Cancel</button><button class="pri">${esc(ok)}</button></div></form>`;
  document.body.append(d);
  peekable(d);
  const f = d.querySelector("form");
  d.onclick = e => { if (e.target === d) d.remove(); };
  f.querySelector(".ghost").onclick = () => d.remove();
  f.onsubmit = async e => {
    e.preventDefault();
    try { await fn(Object.fromEntries(new FormData(f))); d.remove(); }
    catch (x) { f.querySelector(".err").textContent = x.message; }
  };
  (f.querySelector("input:not([readonly]),select") || f.querySelector(".pri")).focus();
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePop(); document.querySelector(".ov:last-of-type")?.remove(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k" && $("#gq")) { e.preventDefault(); $("#gq").focus(); $("#gq").select(); }
});
const same = (v, msg) => { if (v.new !== v.confirm) throw new Error(msg || "Passwords do not match."); };
const pwFields = [{k:"new", l:"New password", t:"password"}, {k:"confirm", l:"Confirm password", t:"password"}];

/* small pop-up panels (notifications, account menu) */
const closePop = () => document.querySelectorAll(".pop").forEach(p => p.remove());
function popover(anchor, html, above) {
  const was = document.querySelector(".pop"); closePop(); if (was && was.dataset.for === anchor.dataset.a) return;
  const p = document.createElement("div"); p.className = "pop"; p.dataset.for = anchor.dataset.a; p.innerHTML = html; document.body.append(p);
  const r = anchor.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(r.right - p.offsetWidth, innerWidth - p.offsetWidth - 8)) + "px";
  p.style.top = Math.max(8, above ? r.top - p.offsetHeight - 8 : r.bottom + 8) + "px";
}

      $("#app").innerHTML = `<main style="max-width:560px;margin:12vh auto;padding:0 20px"><h2 style="font-size:40px">The library server isn't running</h2>

        <p class="mut">Then go to <b>http://localhost:8000</b> in your browser. Opening index.html directly will not work.</p></main>`;

  S.tab = "overview"; shell();
}

        <button class="ibtn" data-a="edit" data-id="${esc(b.book_id)}" aria-label="Edit ${esc(b.title)}" title="Edit">${ic("edit")}</button>
        <button class="ibtn danger" data-a="del" data-id="${esc(b.book_id)}" aria-label="Delete ${esc(b.title)}" title="Delete">${ic("trash")}</button></td>` : ""}</tr>`;
  }), S.q || S.cat !== "All" || S.st !== "all" ? "No books match. Try a different search or filter." : "The catalog is empty.");
}
async function loadStrip() {
  const el = $("#strip"); if (!el) return;
  const cell = (label, icon, n, sub, subIcon) => `<div class="cell"><div class="cell-top"><span>${label}</span>${ic(icon)}</div><div class="num">${n}</div><div class="cell-sub">${subIcon ? ic(subIcon) : ""}${sub}</div></div>`;
  try {
    const [cats, active, all, books] = await Promise.all([api("categories"), api("loans", {mode:"active"}), api("loans", {mode:"all"}), api("books", {search:"", category:"All"})]);
    const t = todayISO(), soon = plusDays(3), overdue = active.filter(l => l.due_date < t).length;
    const across = `Across ${cats.length} categor${cats.length === 1 ? "y" : "ies"}`;
    let cells;
    if (LIB()) {
      const [st, mem] = await Promise.all([api("stats"), api("members")]);
      cells = [cell("Books in collection", "book", num(st.books), across),
        cell("Currently on loan", "copy", num(st.issued), `${all.filter(l => l.issue_date >= plusDays(-7)).length} this week`, "up"),
        cell("Due back today", "clock", num(active.filter(l => l.due_date === t).length), `${st.overdue} overdue`, "clock"),
        cell("Active members", "users", num(st.members), `${mem.filter(m => m.created_on.startsWith(t.slice(0, 7))).length} new this month`, "down")];
    } else {
      cells = [cell("Books in collection", "book", num(books.length), across),
        cell("On loan to you", "copy", num(active.length), `${all.length} borrowed so far`, "up"),
        cell("Due within 3 days", "clock", num(active.filter(l => l.due_date >= t && l.due_date <= soon).length), `${overdue} overdue`, "clock"),
        cell("Fine so far", "wallet", "₹" + num(active.reduce((s, l) => s + l.fine, 0)), "Only charged when late")];
    }
    if ($("#strip")) el.innerHTML = cells.join("");
  } catch { /* the strip just stays blank */ }
}
async function loadActivity() {
  const el = $("#activity"); if (!el) return;
  let loans; try { loans = await api("loans", {mode:"all"}); } catch { return; }
  const ev = [];
  loans.forEach(l => { ev.push({d:l.issue_date, k:"b", l}); if (l.return_date) ev.push({d:l.return_date, k:"r", l}); });
  ev.sort((a, b) => b.d.localeCompare(a.d) || b.l.id - a.l.id || (b.k === "r") - (a.k === "r"));
  const t = todayISO();
  if (!$("#activity")) return;
  el.innerHTML = `<div class="eyebrow coral">At the front desk</div><h2>Recent activity</h2>` + (ev.length ? ev.slice(0, 4).map(({k, l}) => {
    const [bg, fg] = tint(l.name);
    return `<div class="act"><span class="av" style="background:${bg};color:${fg}">${esc(initials(l.name))}</span>
      <div class="act-main"><b>${LIB() ? esc(l.name) : "You"}</b> <span class="mut">${k === "b" ? "borrowed" : "returned"}</span><small>${esc(l.title)}</small></div>
      <div class="act-side">${k === "b" ? `<span>Due ${fdate(l.due_date)}</span><small>Borrowed</small>`
        : `<span class="okc">${ic("check")}${l.return_date === t ? "Today" : fdate(l.return_date)}</span><small>Returned</small>`}</div></div>`;
  }).join("") + `<button class="more" data-a="tab" data-id="loans">See all activity ${ic("up")}</button>`
    : `<p class="mut">Nothing has been borrowed yet.</p>`);
}
async function loadExtras() {
  const el = $("#extras"); if (!el) return;
  let all, info; try { [all, info] = await Promise.all([api("books", {search:"", category:"All"}), api("info")]); } catch { return; }
  if (!$("#extras")) return;
  const counts = {}; all.forEach(b => counts[b.category] = (counts[b.category] || 0) + 1);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 4);
  el.innerHTML = (top.length ? `<div class="picks"><div class="tiles">${top.map(([c, n]) => { const [bg, fg] = cover(c);
      return `<button class="tile" data-a="shelf" data-id="${esc(c)}" style="background:${bg};color:${fg}"><span>${esc(c)}</span><small>${n} book${n === 1 ? "" : "s"}</small></button>`; }).join("")}</div>
    <div class="picks-foot"><div><div class="eyebrow">Shelves</div><b>Browse the collection by category</b></div>${ic("up")}</div></div>` : "") +
    `<div class="note"><div class="eyebrow">${ic("sparkle")}A librarian’s note</div><h2>Good to know.</h2><p>${esc(info.fact)}</p>
    <div class="meta">${ic("clock")}<b>Keep a book for ${info.loan_days} days</b><i></i><span>up to ${info.max_books} at a time · late fee ₹${info.flat_fee} plus ₹${info.per_day} a day</span></div></div>`;
}

/* ---------- members (librarian) ---------- */
async function vMembers() {
  const m = await api("members");
  $("#v").innerHTML = head("The community", "Members", `${m.length} active member${m.length === 1 ? "" : "s"} in the library.`,
      `<button class="pri" data-a="addm">${ic("plus")}Add member</button>`) + `<div style="height:30px"></div>` +
    table(["Member", "Phone", "Books held", "Member since", ""], m.map(x => { const [bg, fg] = tint(x.name); return `<tr>
      <td><div class="who"><span class="av" style="background:${bg};color:${fg}">${esc(initials(x.name))}</span><div><b>${esc(x.name)}</b><small>${esc(x.username)}</small></div></div></td>
      <td class="mut">${esc(x.phone)}</td><td>${x.held ? `<span class="chip out"><i></i>${x.held}</span>` : `<span class="mut">0</span>`}</td><td class="mut">${esc(fdate(x.created_on))}</td>
      <td class="acts"><button class="sm" data-a="reset" data-id="${x.id}">Reset password</button>
      <button class="sm danger" data-a="rm" data-id="${x.id}">Remove</button></td></tr>`; }), "No members yet. Add the first one.");
}

/* ---------- borrow & return ---------- */
async function vLoans() {
  const modes = [["active", "Currently issued"], ["overdue", "Overdue"], ["all", "Full history"]];
  const rows = await api("loans", {mode:S.mode});
  $("#v").innerHTML = head("At the front desk", LIB() ? "Borrow &amp; return" : "My books",
      LIB() ? "Everything that is out, due back, or already returned." : "What you have borrowed, and when it is due back.") + `<div style="height:30px"></div>
    <div class="seg">${modes.map(([k, n]) => `<button data-a="mode" data-id="${k}" class="${k === S.mode ? "on" : ""}">${n}</button>`).join("")}</div>` +
    table(["Book", ...(LIB() ? ["Member"] : []), "Issued", "Due", "Returned", "Fine", "Status"], rows.map(l => {
      const k = l.status === "Returned" ? "done" : l.status === "On time" ? "ok" : "bad";
      return `<tr><td><b>${esc(l.title)}</b></td>${LIB() ? `<td>${esc(l.name)}<small>${esc(l.username)}</small></td>` : ""}
      <td class="mut">${esc(fdate(l.issue_date))}</td><td class="mut">${esc(fdate(l.due_date))}</td><td class="mut">${esc(fdate(l.return_date))}</td>
      <td>${l.fine ? "₹" + l.fine : ""}</td><td><span class="chip ${k}"><i></i>${esc(l.status)}</span></td></tr>`;
    }), S.mode === "overdue" ? "Nothing is overdue. Nice." : "Nothing here yet.");
}

/* ---------- actions ---------- */
const bookFields = async (b = {}) => [
  {k:"book_id", l:"Book ID", v:b.book_id, ro:!!b.book_id}, {k:"title", l:"Title", v:b.title}, {k:"author", l:"Author", v:b.author},
  {k:"category", l:"Category", v:b.category || "General", dl:await api("categories")}];
const memberForm = (done) => modal("Create member account", [
  {k:"name", l:"Full name"}, {k:"phone", l:"Phone (10 digits)"}, {k:"username", l:"Username"},
  {k:"password", l:"Password", t:"password"}, {k:"confirm", l:"Confirm password", t:"password"},
  {k:"question", l:"Security question" + (done ? " (optional)" : ""), dl:QUESTIONS},
  {k:"answer", l:"Your answer" + (done ? " (optional)" : "")}],
  "Create account", async v => {
    if (v.password !== v.confirm) throw new Error("Passwords do not match.");
    await api(done ? "add_member" : "signup", v); toast(`Account '${v.username.trim().toLowerCase()}' created`); done && done();
  }, done ? "The security question is optional here. The member can add one later."
          : "Pick or write a question only you can answer. You will need it if you forget your password.");
/* forgot password, step 2: answer the question and choose a new password */
const recoverForm = (username, question) => modal("Reset your password", [{k:"answer", l:"Your answer"}, ...pwFields], "Reset password",
  async v => {
    same(v); await api("recover", {username, answer:v.answer, new:v.new});
    toast("Password updated. You can log in now.");
    const box = $("#lf [name=username]"); if (box) box.value = username;
  }, "Security question: " + question);
const refresh = () => { loadBooks(); loadStrip(); loadActivity(); refreshBell(); };
const H = {
  tab: id => go(id),
  mode: id => { S.mode = id; view(); },
  shelf: c => { S.cat = c; S.st = "all"; vBooks().then(() => $("#shelves")?.scrollIntoView({behavior:"smooth", block:"start"})); },
  out: async () => { await api("logout"); S.user = null; closePop(); loginView(); },
  signup: () => memberForm(),
  forgot: () => modal("Forgot password", [{k:"username", l:"Your username", v:$("#lf [name=username]")?.value || ""}], "Continue",
    async v => { const r = await api("recovery_question", v); recoverForm(v.username.trim().toLowerCase(), r.question); },
    "Enter your username and we will show your security question."),
  addm: () => memberForm(view),
  sq: () => modal("Security question", [{k:"password", l:"Current password", t:"password"},
    {k:"question", l:"Question", dl:QUESTIONS}, {k:"answer", l:"Your answer"}], "Save",
    async v => { await api("set_question", v); S.user.has_question = true; toast("Security question saved"); },
    "Used to reset your password if you forget it. Saving a new one replaces the old one."),
  pw: () => modal("Change password", [{k:"current", l:"Current password", t:"password"}, ...pwFields], "Change password",
    async v => { same(v, "New passwords do not match."); await api("change_pw", v); toast("Password updated"); }),
  menu: (id, el) => popover(el, `<h4>${esc(S.user.name)}</h4><button data-a="sq">Security question</button><button data-a="pw">Change password</button><button data-a="out">Log out</button>`, el.closest(".side")),
  bell: (id, el) => popover(el, `<h4>Notifications</h4>` + (S.alerts.length ? S.alerts.slice(0, 8).map(l => {
      const t = todayISO(), late = l.due_date < t;
      return `<div class="it"><b class="${late ? "bad" : ""}">${late ? "Overdue" : l.due_date === t ? "Due today" : "Due " + fdate(l.due_date)}</b> · ${esc(l.title)}<small>${LIB() ? esc(l.name) : "Please return it to the librarian"}</small></div>`;
    }).join("") : `<div class="empty">You're all caught up.</div>`)),
  add: async () => modal("Add book", await bookFields(), "Add book", async v => { await api("add_book", v); toast("Book added"); refresh(); }),
  edit: async id => modal("Edit book", await bookFields(S.rows.find(b => b.book_id === id)), "Save changes",
    async v => { await api("edit_book", v); toast("Book updated"); refresh(); }),
  del: id => modal("Delete book", [], "Delete", async () => { await api("delete_book", {book_id:id}); toast("Book deleted"); refresh(); },
    `Delete book ${id} permanently? Its loan history goes with it.`),
  issue: async id => modal("Issue book", [{k:"username", l:"Member username", t:"select", o:(await api("members")).map(m => m.username)}], "Issue book",
    async v => { const r = await api("issue", {book_id:id, ...v}); toast(`Issued. Due on ${fdate(r.due)}`); refresh(); }),
  ret: async id => { const r = await api("return", {book_id:id});
    toast(r.fine ? `Returned ${r.late_days} day(s) late. Fine to collect: ₹${r.fine}` : "Returned on time. No fine.", !!r.fine); refresh(); },
  reset: id => modal("Reset password", pwFields, "Reset password",
    async v => { same(v); await api("reset_pw", {id, new:v.new}); toast("Password reset"); }),
  rm: id => modal("Remove member", [], "Remove", async () => { await api("remove", {id}); toast("Member removed"); view(); },
    "They will no longer be able to log in."),
};
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]");
  if (!b) { if (!e.target.closest(".pop")) closePop(); return; }       // click elsewhere closes open panels
  if (!["bell", "menu"].includes(b.dataset.a)) closePop();             // bell and menu toggle themselves
  try { await H[b.dataset.a](b.dataset.id, b); } catch (x) { toast(x.message, 1); }
});
boot();
</script>
</body>
</html>
